[package]
name = "shadowvpn"
version = "0.21.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-single-instance = { version = "2", optional = true }

[[bin]]
name = "shadowvpn"
path = "src/main.rs"
required-features = ["desktop"]
